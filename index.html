<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для моего додо</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #fff0f5;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Georgia', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #7a4a5e;
    padding: 20px;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, #ffe4ec 0%, #fff0f5 60%, #fce4ec 100%);
    z-index: -1;
  }

  .title {
    font-size: 2.2rem;
    letter-spacing: 2px;
    text-align: center;
    margin-bottom: 12px;
    color: #d67a9e;
    text-shadow: 0 2px 12px rgba(255, 182, 213, 0.7);
  }

  .subtitle {
    font-size: 1rem;
    color: #b58a9e;
    margin-bottom: 40px;
    font-style: italic;
    text-align: center;
    padding: 0 20px;
    line-height: 1.6;
  }

  .player {
    background: rgba(255, 255, 255, 0.65);
    border: 1px solid rgba(255, 182, 213, 0.6);
    border-radius: 24px;
    padding: 28px 38px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 40px rgba(255, 182, 213, 0.45);
    text-align: center;
    z-index: 10;
  }

  audio {
    width: 300px;
    max-width: 80vw;
    filter: hue-rotate(300deg) saturate(1.3);
    border-radius: 30px;
  }

  .flower {
    position: fixed;
    top: -50px;
    font-size: 24px;
    animation: fall linear infinite;
    opacity: 0.85;
    z-index: 1;
    user-select: none;
    pointer-events: none;
  }

  @keyframes fall {
    0% {
      transform: translateY(-10vh) rotate(0deg);
      opacity: 0;
    }
    10% { opacity: 0.95; }
    90% { opacity: 0.95; }
    100% {
      transform: translateY(110vh) rotate(360deg);
      opacity: 0;
    }
  }
</style>
</head>
<body>

  <h1 class="title">Эта песня — о додо 🌹</h1>
  <p class="subtitle">Каждый раз, когда я её слышу, я думаю о своем додо!</p>

  <div class="player">
    <audio controls loop>
      <source src="song.mp3" type="audio/mpeg">
      Твой браузер не поддерживает аудио.
    </audio>
  </div>

<script>
  const flowers = ['🌸','🌹','🌷','💐','🌺','🥀','💮','🏵️','🌼'];

  function createFlower() {
    const f = document.createElement('div');
    f.classList.add('flower');
    f.textContent = flowers[Math.floor(Math.random() * flowers.length)];
    f.style.left = Math.random() * 100 + 'vw';
    f.style.fontSize = (16 + Math.random() * 24) + 'px';
    f.style.animationDuration = (6 + Math.random() * 8) + 's';
    f.style.animationDelay = Math.random() * 2 + 's';
    document.body.appendChild(f);

    setTimeout(() => f.remove(), 16000);
  }

  setInterval(createFlower, 400);
</script>

</body>
</html>
